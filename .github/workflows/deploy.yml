name: Build and deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Build
      run: |
        npm ci
        npx hexo generate

    # Alleen deployen bij een push naar master, niet bij pull requests.
    # Net als voorheen worden er geen bestanden op de server verwijderd.
    - name: Deploy
      if: github.event_name == 'push'
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
      run: |
        sudo apt-get install -y -qq lftp
        lftp -u "$FTP_USER" --env-password "sftp://$FTP_SERVER" \
          -e "set sftp:auto-confirm yes; set net:max-retries 2; mirror -R --verbose public /site/www; bye"
